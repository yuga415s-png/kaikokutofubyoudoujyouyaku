        @keyframes slashAnim { 0% { opacity: 0; width: 0px; } 40% { opacity: 1; width: 280px; } 100% { opacity: 0; width: 300px; } }

        .hit-flash { animation: hitAnimation 0.35s ease-out; }
        @keyframes hitAnimation {
            0% { filter: brightness(4) sepia(1) hue-rotate(120deg) saturate(5); transform: translateX(-50%) scale(1.15) rotate(3deg); }
            50% { filter: brightness(0.2); transform: translateX(-50%) scale(0.9) rotate(-3deg); }

        .hp-bar-bg { background: #2a2a35; height: 10px; border-radius: 5px; border: 1px solid #555; overflow: hidden; }
        .hp-bar-fill { background: linear-gradient(90deg, #0984e3, #00cec9); height: 100%; width: 100%; transition: width 0.4s ease-out; }

        .options { display: grid; grid-template-columns: 1fr; gap: 8px; }
        
        .btn {

        .chest-msg { font-size: 18px; color: #ffd700; font-weight: bold; margin: 15px 0; text-shadow: 0 0 8px #ff8c00; }
        .get-item-btn { background: #e67e22; color: white; border: none; padding: 10px 20px; font-size: 14px; border-radius: 8px; font-weight: bold; cursor: pointer; }

            font-size: 14px; border-radius: 8px; cursor: pointer; margin: 10px 5px 0 5px; font-weight: bold;
        }
    </style>
</head>
<body>

<script>
// ==================== Web Audio API サウンド (海・黒船テーマに刷新) ====================
let audioCtx = null;
let soundEnabled = true;
let bgmInterval = null;

function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function toggleSound() {
    soundEnabled = !soundEnabled;
    document.getElementById("soundStatus").innerText = soundEnabled ? "ON" : "OFF";
    if (!soundEnabled) stopBGM();
    else playBGM('select');
}

function playSE(type) {
    if (!soundEnabled) return;
    initAudio();
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);

    if (type === 'hit') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(400, now);
        osc.frequency.exponentialRampToValueAtTime(100, now + 0.15);
        gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
        osc.start(now); osc.stop(now + 0.15);
    } else if (type === 'miss') {
        osc.type = 'square'; osc.frequency.setValueAtTime(150, now);
        osc.frequency.setValueAtTime(100, now + 0.15);
        gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
        osc.start(now); osc.stop(now + 0.2);
    } else if (type === 'chest') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.setValueAtTime(1046.50, now + 0.15);
        gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
        osc.start(now); osc.stop(now + 0.3);
    } else if (type === 'clear') {
        const notes = [440, 554.37, 659.25, 880];
        notes.forEach((freq, idx) => {
            const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
            o.type = 'triangle'; o.connect(g); g.connect(audioCtx.destination);
            o.frequency.setValueAtTime(freq, now + idx * 0.12);
            g.gain.setValueAtTime(0.2, now + idx * 0.12);
            g.gain.linearRampToValueAtTime(0.01, now + idx * 0.12 + 0.3);
            o.start(now + idx * 0.12); o.stop(now + idx * 0.12 + 0.3);
        });
    }
}

function stopBGM() {
    if (bgmInterval) { clearInterval(bgmInterval); bgmInterval = null; }
}

function playBGM(mode) {
    if (!soundEnabled) return;
    initAudio(); stopBGM();
    let step = 0; let notes = []; let speed = 250;

    // 海洋・黒船来航の重厚感あるスケールに変更
    if (mode === 'select') { notes = [220, 261, 329, 261]; speed = 260; }
    else if (mode === 1) { notes = [146, 174, 220, 174, 146, 130]; speed = 210; }
    else if (mode === 2) { notes = [130, 155, 174, 196, 174, 155]; speed = 180; }
    else if (mode === 3) { notes = [110, 116, 130, 146, 130, 116]; speed = 140; }

    bgmInterval = setInterval(() => {
        if (!soundEnabled) return;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
        osc.type = (mode === 'select') ? 'triangle' : (mode === 3 ? 'sawtooth' : 'sine');
        osc.frequency.setValueAtTime(notes[step % notes.length], now);
        gain.gain.setValueAtTime(0.05, now);
        gain.gain.linearRampToValueAtTime(0.001, now + (speed / 1000) * 0.85);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(now); osc.stop(now + (speed / 1000) * 0.85);
        step++;
    }, speed);
}

// ==================== モンスターSVG（黒船・ペリー・不平等条約モチーフ） ====================
const monsterSVGs = [
    // 1. 蒸気船黒船（ブラック・スクーナー）
    'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160"><defs><linearGradient id="g1" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="%23333333"/><stop offset="100%" stop-color="%23050505"/></linearGradient></defs><path d="M10 100 Q80 130 150 100 L135 125 Q80 145 25 125 Z" fill="url(%23g1)" stroke="%2300cec9" stroke-width="2"/><rect x="70" y="30" width="20" height="70" fill="%23111"/><line x1="80" y1="30" x2="80" y2="10" stroke="%2300cec9" stroke-width="2"/><rect x="40" y="50" width="8" height="50" fill="%23222"/><rect x="110" y="50" width="8" height="50" fill="%23222"/><circle cx="80" cy="50" r="10" fill="%23ff7675"/><path d="M70 20 C60 10 50 15 40 5 C50 0 70 5 80 15 Z" fill="rgba(200,200,200,0.5)"/><circle cx="45" cy="105" r="4" fill="%23ffd700"/><circle cx="80" cy="108" r="4" fill="%23ffd700"/><circle cx="115" cy="105" r="4" fill="%23ffd700"/></svg>',
    // 2. 東インド艦隊提督ペリー影（ダーク・ペリー）
    'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160"><defs><linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="%230984e3"/><stop offset="100%" stop-color="%232c3e50"/></linearGradient></defs><path d="M40 40 L120 40 L130 65 L30 65 Z" fill="%23111" stroke="%23ffd700" stroke-width="2"/><rect x="55" y="15" width="50" height="25" fill="%23111"/><circle cx="80" cy="85" r="35" fill="url(%23g2)"/><circle cx="68" cy="80" r="6" fill="%23fff"/><circle cx="92" cy="80" r="6" fill="%23fff"/><circle cx="68" cy="80" r="2" fill="%23000"/><circle cx="92" cy="80" r="2" fill="%23000"/><path d="M70 105 Q80 115 90 105" stroke="%23fff" stroke-width="3" fill="none"/><path d="M30 110 L130 110 L140 150 L20 150 Z" fill="%231e272e" stroke="%23ffd700" stroke-width="2"/></svg>',
    // 3. 不平等条約の幻影（インイクアリティ・ゴーレム）
    'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160"><defs><linearGradient id="g3" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="%232d3436"/><stop offset="100%" stop-color="%23111111"/></linearGradient></defs><rect x="30" y="20" width="100" height="120" rx="8" fill="url(%23g3)" stroke="%23ff7675" stroke-width="3"/><line x1="45" y1="40" x2="115" y2="40" stroke="%23aaa" stroke-width="4"/><line x1="45" y1="60" x2="115" y2="60" stroke="%23aaa" stroke-width="4"/><line x1="45" y1="80" x2="115" y2="80" stroke="%23aaa" stroke-width="4"/><circle cx="60" cy="105" r="12" fill="%23d63031"/><circle cx="100" cy="105" r="12" fill="%23d63031"/><polygon points="80,40 70,70 90,70" fill="%23ff7675"/><path d="M50 125 Q80 140 110 125" stroke="%23ff7675" stroke-width="4" fill="none"/></svg>'
];

const monsterNames = ["黒船艦隊 ブラック・スクーナー", "東インド艦隊提督 ダーク・ペリー", "不平等条約 インイクアリティ"];
const levelBadges = ["ステージ 1：黒船来航と和親条約", "ステージ 2：修好通商条約と開港", "ステージ 3：不平等条約の真実"];

// ==================== 問題データ（添付画像の教科書内容から作成：各ステージ10問：計30問） ====================
const questionsByLevel = {
    // ステージ1：黒船来航と日米和親条約
    1: [
        { q: "1853年、4隻の軍艦（黒船）を率いて浦賀（神奈川県）に来航したアメリカの東インド艦隊司令長官は誰？", options: ["ペリー", "ハリス", "オールコック", "パークス"], ans: 0, exp: "ペリーはアメリカ大統領の国書を幕府に受け取らせました。", hint: "教科書画像の上部に写真が掲載されている人物です。" },
        { q: "アメリカが日本に開国を求める大きな目的となった、太平洋で行われていた漁業は何？", options: ["捕鯨（クジラ捕り）", "マグロ漁", "ニシン漁", "カニ漁"], ans: 0, exp: "アメリカは鯨油を採るために太平洋で捕鯨を盛んに行っていました。", hint: "鯨（クジラ）を捕まえる産業です。" },

// ==================== ゲーム状態変数 ====================
let userProgress = JSON.parse(localStorage.getItem('dungeon_progress_v3')) || { 1: 0, 2: 0, 3: 0 };
let currentStage = 1;
let currentQ = 0;
let correctAnswersCount = 0;
let streakCount = 0;

let items = { twoOpts: 0, hint: 0 };

// ==================== 画面遷移・処理 ====================
function updateSelectScreenUI() {
    for (let i = 1; i <= 3; i++) {
        const card = document.getElementById(`card${i}`);
        const badge = document.getElementById(`badge${i}`);
        const isUnlocked = (i === 1) || (userProgress[i - 1] > 0);

        if (isUnlocked) {
            card.classList.remove('locked');
            badge.innerText = (userProgress[i] > 0) ? "★" : "☆";
        } else {
            card.classList.add('locked');
            badge.innerText = "🔒";
        }
    }
    let total = 0;
    for (let i = 1; i <= 3; i++) if (userProgress[i] > 0) total++;
    document.getElementById("totalStars").innerText = "★".repeat(total) + "☆".repeat(3 - total);
}

function startSelectedStage(stageNum) {
    const isUnlocked = (stageNum === 1) || (userProgress[stageNum - 1] > 0);
    if (!isUnlocked) { alert("前のステージをクリアすると解放されます！"); return; }

    currentStage = stageNum;
    currentQ = 0;
    correctAnswersCount = 0;
    streakCount = 0;

    document.getElementById("selectScreen").style.display = "none";
    document.getElementById("clearArea").style.display = "none";
    document.getElementById("gameArea").style.display = "block";

    updateItemUI();
    playBGM(currentStage);
    loadQuestion();
}

function goToSelect() {
    updateSelectScreenUI();
    document.getElementById("gameArea").style.display = "none";
    document.getElementById("clearArea").style.display = "none";
    document.getElementById("selectScreen").style.display = "block";
    playBGM('select');
}

function shuffleArray(array) {
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function updateItemUI() {
    document.getElementById("countTwoOpts").innerText = items.twoOpts;
    document.getElementById("countHint").innerText = items.hint;
    document.getElementById("itemTwoOptsBtn").disabled = (items.twoOpts <= 0);
    document.getElementById("itemHintBtn").disabled = (items.hint <= 0);
    document.getElementById("streakNum").innerText = streakCount;
}

function loadQuestion() {
    const qData = questionsByLevel[currentStage][currentQ];
    
    document.getElementById("immediateExp").style.display = "none";
    document.getElementById("qText").innerText = `${currentQ + 1}. ${qData.q}`;
    
    const idx = currentStage - 1;
    document.getElementById("monsterImg").src = monsterSVGs[idx];
    document.getElementById("monsterName").innerText = monsterNames[idx];
    document.getElementById("levelBadge").innerText = levelBadges[idx];

    const totalQ = questionsByLevel[currentStage].length;
    const remainingHpPercent = ((totalQ - correctAnswersCount) / totalQ) * 100;
    document.getElementById("hpFill").style.width = remainingHpPercent + "%";

    const container = document.getElementById("optionBtns");
    container.innerHTML = "";
    
    const shuffledOptions = shuffleArray(qData.options);
    shuffledOptions.forEach((optText) => {
        const btn = document.createElement("button");
        btn.className = "btn";
        btn.innerText = optText;
        btn.onclick = () => checkAnswer(optText, qData.options[qData.ans], qData);
        container.appendChild(btn);
    });

    updateItemUI();
}

function checkAnswer(selectedText, correctText, qData) {
    const btns = document.querySelectorAll(".btn");
    btns.forEach(b => b.disabled = true);

    const monsterImg = document.getElementById("monsterImg");
    const slashEffect = document.getElementById("slashEffect");
    const expBox = document.getElementById("immediateExp");
    const expTitle = document.getElementById("expTitle");
    const expBody = document.getElementById("expBody");

    let isCorrect = (selectedText === correctText);

    if (isCorrect) {
        correctAnswersCount++;
        streakCount++;
        playSE('hit');

        slashEffect.classList.remove("slash-active"); void slashEffect.offsetWidth;
        slashEffect.classList.add("slash-active");

        monsterImg.classList.remove("hit-flash"); void monsterImg.offsetWidth;
        monsterImg.classList.add("hit-flash");

        const totalQ = questionsByLevel[currentStage].length;
        document.getElementById("hpFill").style.width = (((totalQ - correctAnswersCount) / totalQ) * 100) + "%";

        expTitle.innerHTML = "<span style='color:#2ed573;'>⚔️ 砲撃ヒット！正解！</span>";
    } else {
        streakCount = 0;
        playSE('miss');
        expTitle.innerHTML = `<span style='color:#ff4757;'>❌ 命中せず... (正解: ${correctText})</span>`;
    }

    expBody.innerText = qData.exp;
    expBox.style.display = "block";

    updateItemUI();

    if (isCorrect && streakCount > 0 && streakCount % 2 === 0) {
        setTimeout(() => { showChestModal(); }, 600);
    }
}

function showChestModal() {
    playSE('chest');
    document.getElementById("chestIcon").innerText = "📦";
    document.getElementById("chestMsg").innerText = `${streakCount}連続正解！宝箱を発見！`;
    document.getElementById("openChestBtn").style.display = "inline-block";
    document.getElementById("chestModal").style.display = "flex";
}

function openTreasureChest() {
    const gotItem = (Math.random() < 0.5) ? 'twoOpts' : 'hint';
    if (gotItem === 'twoOpts') {
        items.twoOpts++;
        document.getElementById("chestIcon").innerText = "✂️";
        document.getElementById("chestMsg").innerText = "「2択にする」アイテムをゲット！";
    } else {
        items.hint++;
        document.getElementById("chestIcon").innerText = "💡";
        document.getElementById("chestMsg").innerText = "「ヒント」アイテムをゲット！";
    }
    document.getElementById("openChestBtn").style.display = "none";
    updateItemUI();

    setTimeout(() => {
        document.getElementById("chestModal").style.display = "none";
    }, 1200);
}

function useItemTwoOpts() {
    if (items.twoOpts <= 0) return;
    items.twoOpts--;
    updateItemUI();

    const qData = questionsByLevel[currentStage][currentQ];
    const correctText = qData.options[qData.ans];
    const btns = Array.from(document.querySelectorAll(".btn"));

    let removed = 0;
    btns.forEach(btn => {
        if (btn.innerText !== correctText && removed < 2) {
            btn.style.visibility = "hidden";
            removed++;
        }
    });
}

function useItemHint() {
    if (items.hint <= 0) return;
    items.hint--;
    updateItemUI();

    const qData = questionsByLevel[currentStage][currentQ];
    alert(`💡 ヒント: ${qData.hint}`);
}

function nextQuestion() {
    currentQ++;
    const totalQ = questionsByLevel[currentStage].length;

    if (currentQ < totalQ) {
        loadQuestion();
    } else {
        finishStage();
    }
}

function finishStage() {
    playSE('clear');
    stopBGM();

    document.getElementById("gameArea").style.display = "none";
    document.getElementById("clearArea").style.display = "block";

    const totalQ = questionsByLevel[currentStage].length;
    const scoreText = `${totalQ}問中 ${correctAnswersCount}問 正解！`;

    userProgress[currentStage] = Math.max(userProgress[currentStage], correctAnswersCount);
    localStorage.setItem('dungeon_progress_v3', JSON.stringify(userProgress));

    document.getElementById("clearTitle").innerText = `🎉 ステージ ${currentStage} 撃破！ 🎉`;
    document.getElementById("resultMessage").innerHTML = `${scoreText}<br>開国と条約の歴史についての知識が深まりました！`;

    const nextBtn = document.getElementById("nextBtn");
    if (currentStage < 3) {
        nextBtn.style.display = "inline-block";
    } else {
        nextBtn.style.display = "none";
    }
}

function nextStageAction() {
    if (currentStage < 3) {
        startSelectedStage(currentStage + 1);
    }
}

// 初期化
updateSelectScreenUI();
playBGM('select');
</script>
